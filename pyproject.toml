[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-tts"
version = "0.1.1"
description = "Qwen-TTS python package"
readme = "README.md"
# DGX Spark baseline: use Python 3.13 with uv sync.
requires-python = ">=3.13,<3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
license = { text = "Apache-2.0" }
authors = [{ name = "Alibaba Qwen Team" }]

dependencies = [
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "gradio",
  "librosa",
  "torch==2.10.0+cu130",
  "torchaudio==2.10.0+cu130",
  "soundfile",
  "sox",
  "onnxruntime",
  "einops",
]

[project.optional-dependencies]
api = ["tts-api-server[mcp]==0.1.0"]

[project.urls]
Homepage = "https://github.com/Qwen/Qwen3-TTS"
Repository = "https://github.com/Qwen/Qwen3-TTS"

[project.scripts]
qwen-tts-demo = "qwen_tts.cli.demo:main"
qwen-tts-api = "qwen_tts_api.cli:main"

[tool.setuptools]
packages = { find = { where = ["."] , include = ["qwen_tts*"] } }
include-package-data = true

[tool.setuptools.package-data]
qwen_tts = ["py.typed", "**/*.npz"]

[tool.uv]
# This fork targets DGX Spark (Linux ARM64).
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.uv.sources]
tts-api-server = { git = "https://github.com/lambdawalker/python.tts.api.server", rev = "8a130e6d8153ddc5442865da4a02566d3eb7dac4" }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
# Keep all other dependencies on PyPI.
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
